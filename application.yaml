apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-argo-application
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/merong-ui/argocd-app-config.git
    targetRevision: HEAD
    path: dev
  destination: 
    server: https://kubernetes.default.svc    #internal service name of K8s API server
    namespace: myapp

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:        #to enable argocd fetch any change from git automatically and automatic self-healing
      selfHeal: true
      prune: true    # removing resources that do not exist in the desired state defined in the Git repository.
